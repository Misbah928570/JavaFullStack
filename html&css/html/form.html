<!DOCTYPE html>
<html lang="en">
<head>
    
    <title>Student Regestration Form</title>
</head>
<body>
    <h2>Student Regestration Form</h2>
    <form>
        <label>Name : </label>
        <input type="text" placeholder="enter your name" required>
        <br>
        <label>Email : </label>
        <input type="email" placeholder="enter your email" required>
        <br>
        <label>Phone no.: </label>
        <input type="tel" placeholder="+91 enter 10digit number" required>
        <br>
        <label>Password : </label>
        <input type="password" placeholder="enter password" required>
        <br>
        <label>Gender : </label>
        <input type="radio" name="Gender">Male
        <input type="radio" name="Gender">Female
        <br>
        <label>Skills</label>
        <input type="checkbox" name="" id="">HTML
        <input type="checkbox" name="" id="">CSS
        <input type="checkbox" name="" id="">java
        <input type="checkbox" name="" id="">python
        <br>
        <label>Select course</label>
        <select>
            <option>Bca</option>
            <option>BE</option>
            <option>Bsc</option>
        </select>
        <br>
        <label>Select programming</label>
        <select>
            <optgroup label="Programming">
                <option>Python</option>
                <option>Java</option>
            </optgroup>
        </select>
        <br>
        
        <label>Enter your extra achievements:</label>
        <br>
        <textarea rows="4" cols="30"></textarea>
        <br>
        <button>Submit</button>
    </form>
</body>
</html>
