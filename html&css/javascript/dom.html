<!DOCTYPE html>
<html lang="en">
<head>
    <title>DOM</title>
</head>
<body>
    <h1 id="title">Welcome</h1>
    <button onclick="changeText()">click</button>
    <script>
        let heading=document.getElementById("title")
        function changeText(){
            heading.innerHTML="Hello World!";
        }
    </script>
</body>
</html>
